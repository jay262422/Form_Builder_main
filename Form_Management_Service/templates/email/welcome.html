<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f8fafc; color:#0f172a; padding:24px;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;">
    <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.12em;color:#64748b;">{{ appName }}</p>
    <h1 style="font-size:24px;margin:16px 0 8px;">Welcome aboard</h1>
    <p style="line-height:1.6;">Hi {{ name }}, your account is ready. You can start building forms right away.</p>
    <p style="margin:24px 0;">
      <a href="{{ dashboardUrl }}" style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600;">Open Dashboard</a>
    </p>
    <p style="font-size:13px;color:#64748b;margin-top:24px;">Need help? Contact {{ supportEmail }}</p>
  </div>
</body>
</html>
